<!doctype html>
<!--
  Printable entry tickets for the two BitConf 2026 workshops, black and white:
  A4, sixteen 95x34mm tickets per page (2 x 8), numbered, with a tear-off stub. Cut along the dashed lines.
  Render: ./render.sh (PDFs) — or open in Chrome and print at 100% / "Actual size".
  ?w=inesa|cristian picks the workshop, ?n=32 how many tickets.
-->
<html>
<head>
<meta charset="utf-8">
<style>
  @page { size: A4; margin: 0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", sans-serif;
    color: #000; background: #fff;
    -webkit-font-smoothing: antialiased;
  }
  .sheet {
    width: 210mm; height: 297mm; padding: 12.5mm 10mm;
    display: grid; grid-template-columns: repeat(2, 95mm); grid-auto-rows: 34mm;
    justify-content: center; align-content: start;
    break-after: page;
  }
  .sheet:last-child { break-after: auto; }

  /* Tickets touch, so one dashed line is one cut */
  .ticket {
    display: flex; height: 34mm;
    border: 0.2mm dashed #888; margin: 0 0 -0.2mm -0.2mm;
  }

  .main { flex: 1; min-width: 0; padding: 3mm 3.2mm 2.6mm; display: flex; flex-direction: column; justify-content: space-between; }
  .top { display: flex; align-items: center; justify-content: space-between; gap: 2mm; }
  .logo { height: 6.4mm; }
  .tag {
    font-size: 1.9mm; font-weight: 750; letter-spacing: .16em; text-transform: uppercase;
    border: 0.25mm solid #000; border-radius: 1mm; padding: 0.6mm 1.3mm;
  }
  .title { font-size: 3.3mm; font-weight: 800; letter-spacing: -0.02em; line-height: 1.12; }
  .speaker { font-size: 2.3mm; color: #333; margin-top: 0.7mm; }
  .speaker b { color: #000; font-weight: 700; }
  .when { display: flex; gap: 2.6mm; font-size: 2.2mm; font-weight: 650; border-top: 0.2mm solid #000; padding-top: 1.3mm; white-space: nowrap; }
  .when span { font-weight: 450; color: #333; }

  .stub {
    width: 19mm; flex: none; border-left: 0.3mm dashed #000;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1.6mm;
    text-align: center;
  }
  .stub .adm { font-size: 1.8mm; font-weight: 750; letter-spacing: .16em; text-transform: uppercase; line-height: 1.4; }
  .stub .num { font-size: 5.4mm; font-weight: 800; letter-spacing: -0.03em; line-height: 1; font-variant-numeric: tabular-nums; }
  .stub .num small { display: block; font-size: 1.9mm; font-weight: 600; letter-spacing: .12em; margin-bottom: 0.6mm; }
  .stub .t { font-size: 1.8mm; font-weight: 600; line-height: 1.25; color: #333; padding: 0 1mm; }

  @media screen {
    body { background: #e9eaf0; }
    .sheet { margin: 8mm auto; background: #fff; box-shadow: 0 2mm 8mm rgb(0 0 0 / .15); }
  }
</style>
</head>
<body>
<template id="ticket">
  <div class="ticket">
    <div class="main">
      <div class="top">
        <img class="logo" src="logo-black.svg" alt="BitConf">
        <div class="tag">Workshop · 1.5 h</div>
      </div>
      <div>
        <div class="title" data-f="title"></div>
        <div class="speaker"><b data-f="speaker"></b> · <span data-f="role"></span></div>
      </div>
      <div class="when">
        <div>Sat, 14 Nov 2026</div>
        <div data-f="time"></div>
        <div><span>Nortek Center, Bălți</span></div>
      </div>
    </div>
    <div class="stub">
      <div class="adm">Admit<br>one</div>
      <div class="num"><small>Nº</small><span data-f="num"></span></div>
      <div class="t" data-f="short"></div>
    </div>
  </div>
</template>
<script>
  const WORKSHOPS = {
    inesa: {
      title: 'Inside the Recruiter’s Mind: How to Ace Your Interview',
      short: 'Recruiter’s Mind',
      speaker: 'Inesa Maidanik',
      role: 'Recruiter / Researcher, Adtelligent',
      time: '11:00 – 12:30',
    },
    cristian: {
      title: 'Creative Confidence Exercise',
      short: 'Creative Confidence',
      speaker: 'Cristian Brînză',
      role: 'UX/UI Designer, Cegeka',
      time: '14:45 – 16:15',
    },
  };
  const PER_SHEET = 16;
  const params = new URLSearchParams(location.search);
  const w = WORKSHOPS[params.get('w') || 'inesa'];
  const count = Number(params.get('n') || 32);
  document.title = `BitConf 2026 workshop tickets — ${w.speaker}`;

  const tpl = document.getElementById('ticket');
  let sheet;
  for (let i = 1; i <= count; i++) {
    if ((i - 1) % PER_SHEET === 0) {
      sheet = document.createElement('div');
      sheet.className = 'sheet';
      document.body.appendChild(sheet);
    }
    const t = tpl.content.cloneNode(true);
    const set = (f, v) => t.querySelectorAll(`[data-f="${f}"]`).forEach((el) => (el.textContent = v));
    set('title', w.title);
    set('speaker', w.speaker);
    set('role', w.role);
    set('time', w.time);
    set('short', w.short);
    set('num', String(i).padStart(3, '0'));
    sheet.appendChild(t);
  }
</script>
</body>
</html>
